# Pack: Numbers
# Each Card needs: id (unique, never reuse or change it), dutch, english, pos.
# Nouns also get an article: de or het. Optional: cognate, false-friend, fact (and facts for the Pack).
# How-to: docs/curator-guide.md
title: Numbers
facts:
  - Above twenty, Dutch says numbers the other way round. 21 is eenentwintig, "one-and-twenty".
  - In Dutch, 2,5 means two and a half (a comma, not a dot), and 1.000 means a thousand.
