# How-to: docs/curator-guide.md
title: Tekenen & kunst
facts:
  - Dutch says Van Gogh with two throaty g sounds, like the ch in Scottish "loch". It sounds more like "fan Hoch" than "van Go".
  - Rembrandt's famous painting The Night Watch (De Nachtwacht) hangs in the Rijksmuseum in Amsterdam.
  - Miffy, the little white rabbit, is Dutch. Her Dutch name is Nijntje, and Dick Bruna drew her.
