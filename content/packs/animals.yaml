# Pack: Animals
# Each Card needs: id (unique, never reuse or change it), dutch, english, pos.
# Nouns also get an article: de or het. Optional: cognate, false-friend, fact (and facts for the Pack).
# How-to: docs/curator-guide.md
title: Animals
facts:
  - Dutch animals make different sounds. A Dutch dog says waf waf, a duck says kwak kwak and a rooster says kukeleku.
  - Young animals often get -je on the end, and every word with -je takes het. Een katje is a kitten, het katje.
