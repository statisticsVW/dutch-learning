# Pack: Gamen
# Each Card needs: id (unique, never reuse or change it), dutch, english, pos.
# Nouns also get an article: de or het. Optional: cognate, false-friend, fact (and facts for the Pack).
# How-to: docs/curator-guide.md
title: Gamen
facts:
  - Dutch borrows English game verbs and gives them Dutch endings. Gamen, levelen, saven. Ik game, jij gamet, ik heb gegamed!
  - Dutch gamers mix in lots of English words, but the grammar around them stays Dutch.
cards:
  - id: gamen-01
    dutch: gamen
    english: to game
    pos: verb
    cognate: true
    fact: Gamen gets Dutch endings. Ik game (I game), hij gamet (he games), ik heb gegamed (I have gamed).
  - id: gamen-02
    dutch: game
    english: [game, video game]
    pos: noun
    article: de
    cognate: true
  - id: gamen-03
    dutch: spel
    english: game
    pos: noun
    article: het
    fact: Spel is any game, like a board game or a sport. A little game is a spelletje.
